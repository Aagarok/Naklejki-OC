/* v0.3: sheet 1 label preview */
.label-intro{margin:10px 0 14px;color:var(--muted)}
.label-sheet{background:#fff;color:#111;border:2px solid #222;border-radius:2px;padding:13px 17px;margin:15px 0;box-shadow:0 2px 8px #0002;font-family:Arial,sans-serif;max-width:650px}
.label-head{display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center;border-bottom:2px solid #222;padding-bottom:9px}
.label-contact{font-size:12px;line-height:1.5}.label-contact strong{font-size:16px}
.label-mark{width:100%;max-height:115px;object-fit:contain}
.label-title{text-align:center;font-size:19px;font-weight:800;text-transform:uppercase;margin:13px 0;border-bottom:1px solid #333;padding-bottom:9px}
.label-main{display:grid;grid-template-columns:105px 1fr;gap:12px;align-items:center}
.label-symbol{width:100%;max-height:130px;object-fit:contain}
.label-data{display:grid;grid-template-columns:125px minmax(0,1fr);gap:7px 10px;font-size:13px}
.label-data strong{overflow-wrap:anywhere}.label-bottom{border-top:1px solid #333;display:flex;justify-content:space-between;font-size:11px;padding-top:8px;margin-top:12px}

/* v0.4: physical label reference, 96.2 × 70.8 mm driver paper */
.label-sheet{width:100%;max-width:650px;aspect-ratio:1.82/1;background:linear-gradient(125deg,#f4f6f8,#c8d0d9 50%,#edf0f4);color:#111;border:0;border-radius:20px;padding:5% 6% 4%;margin:18px auto;box-shadow:0 3px 16px #0003;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;justify-content:space-between}
.label-head{display:flex;justify-content:center;align-items:center;gap:9%;border:0;padding:0;min-height:35%}
.label-contact{text-align:center;font-size:clamp(9px,1.7vw,15px);line-height:1.35;font-weight:700}.label-contact strong{font-size:1em}
.label-ce{font-family:Arial,sans-serif;font-weight:900;font-size:clamp(28px,6vw,52px);letter-spacing:-.11em;padding-right:.15em}
.label-title{text-align:center;font-size:clamp(10px,1.9vw,16px);font-weight:750;text-transform:none;border-top:1px solid #333;border-bottom:0;margin:0;padding:4px 0 0}
.label-main{display:grid;grid-template-columns:24% 1fr;gap:3%;align-items:center;flex:1;min-height:0}
.label-symbol{width:100%;height:auto;max-height:130px;object-fit:contain;image-rendering:auto}
.label-data{display:grid;grid-template-columns:49% 51%;gap:4px 0;font-size:clamp(9px,1.7vw,15px);line-height:1.15;font-weight:400}.label-data strong{font-weight:400;overflow-wrap:anywhere}

[3]}</span><strong>${escapeHTML(x.v)}</strong><span>${labels[4]}</span><strong>${escapeHTML(state.year)}</strong></div></div><div class="label-bottom"><span>Made in Poland</span><span>IEC 60439-1</span></div></div></div>`).join('')}<div class="panel print-controls"><strong>Wydruk próbny — Zebra GX430t</strong><p class="muted">Ustaw w oknie drukowania: ZDesigner GX430t, skala 100%, marginesy brak, bez nagłówków i stopek. Najpierw wydrukuj jedną etykietę próbną. Papier w sterowniku: 96,2 × 70,8 mm. Nie drukuj seryjnie przed sprawdzeniem położenia.</p><label for="printOffsetY">Przesunięcie góra / dół (mm)</label><input id="printOffsetY" type="number" min="-10" max="10" step="0.5" value="${state.printOffsetY}"><p class="muted">Wartość ujemna przesuwa wydruk w górę, dodatnia w dół — także przy obrocie 180°. Domyślnie 0 mm — pozycja dopasowana do wzoru. Ręczna korekta jest opcjonalna.</p><label for="printScale">Rozmiar zawartości (%)</label><input id="printScale" type="number" min="70" max="120" step="1" value="${state.printScale}"><p class="muted">Układ jest wyśrodkowany poziomo i ma bazową korektę położenia w pionie zgodną z wydrukiem wzorcowym. Domyślnie 100% i przesunięcie 0 mm. Rozmiar i położenie bazowe dopasowano do porównania fizycznego wydruku z Excelem. Oba języki mają jednakową wielkość. Zakres 70–120%: zmienia napisy i grafiki razem, zachowując papier 96,2 × 70,8 mm. W podglądzie drukowania przeglądarki pozostaw skalę 100%. Ustawienia są zapamiętywane na tym urządzeniu. Po zmianie wydrukuj jedną etykietę próbną.</p><label for="printRotation">Obrót wydruku (gdy drukarka obraca etykietę)</label><select id="printRotation"><option value="none" ${state.printRotation==='none'?'selected':''}>Bez obrotu (domyślnie)</option><option value="180" ${state.printRotation==='180'?'selected':''}>Obróć o 180°</option></select><p class="muted"><small>Uwaga: kod QR jest nadal statyczny. Sprawdź jego przeznaczenie przed użyciem produkcyjnym.</small></p></div><div class="actions">$ else {html=`<h2>Nowy wydruk</h2><p class="muted">Wybierz sposób przygotowania naklejek.</p><div class="tabs">${button('Pojedyncze','single',state.mode==='single'?'active':'')}${button('Wiele','multi',state.mode==='multi'?'active':'')}</div>`;if(state.mode==='single'){html+=`<label>Numer urządzenia</label><input id="single" value="${escapeHTML(state.single)}" placeholder="Wpisz numer urządzenia"><label>Wybierz napięcie</label><div class="tiles">${['230 VAC','3X400 VAC'].map(v=>`<button class="tile ${state.voltage===v?'active':''}" data-voltage="${v}">⚡ ${v}${state.voltage===v?' ✓':''}</button>`).join('')}</div><div class="actions">${button('Podgląd i drukowanie →','preview','primary')}</div>`}else {let p=parse();if(state.step==='paste'){html+=`<div class="paste-heading"><label for="raw">Wklej dane z Excela lub Numbers</label>${button('Wyczyść','clear')}</div><textarea id="raw" placeholder="Zaznacz komórki i wklej tutaj (⌘V / Ctrl+V)">${escapeHTML(state.raw)}</textarea><p class="muted">Wyodrębniamy tylko numery K. Pozostałe opisy są pomijane.</p><div class="stats"><div class="stat"><strong>${p.unique.length}</strong>Rozpoznane</div><div class="stat"><strong>${p.ignored.length}</strong>Pominięte*</div><div class="stat"><strong>${p.duplicates.length}</strong>Duplikaty</div></div>${p.unique.length?`<div class="panel">${p.unique.map(n=>`<span class="pill">K${escapeHTML(n)}</span>`).join('')}</div>`:''}${p.ignored.length||p.duplicates.length?`<div class="warning">${p.ignored.length?'Pominięte fragmenty: '+escapeHTML(p.ignored.join(' | '))+'\n':''}${p.duplicates.length?'Powtórzone numery: '+p.duplicates.map(n=>'K'+n).join(', '):''}</div>`:''}<p class="muted"><small>*Liczba pominiętych fragmentów jest orientacyjna, nie oznacza liczby central.</small></p><div class="actions">${button('Dalej: wybór 230 VAC →','select','primary')}</div>`}else if(state.step==='select'){html+=`<h2>Wybierz numery 230 VAC</h2><p class="muted">Pozostałe otrzymają automatycznie 3X400 VAC.</p><div class="tiles">${p.unique.map(n=>`<button class="tile ${state.selected.has(n)?'active':''}" data-number="${escapeHTML(n)}">K${escapeHTML(n)} ${state.selected.has(n)?'✓':''}</button>`).join('')}</div><div class="panel">230 VAC: ${p.unique.filter(n=>state.selected.has(n)).length} • 3X400 VAC: ${p.unique.filter(n=>!state.selected.has(n)).length}</div><div class="actions">${button('← Wróć','paste')}${button('Dalej →','summary','primary')}</div>`}else{html+=`<h2>Podsumowanie</h2><div class="panel"><b>230 VAC</b><p>${p.unique.filter(n=>state.selected.has(n)).map(n=>'K'+n).join(', ')||'Brak'}</p><b>3X400 VAC</b><p>${p.unique.filter(n=>!state.selected.has(n)).map(n=>'K'+n).join(', ')||'Brak'}</p></div><div class="actions">${button('← Wróć','select')}${button('Podgląd →','preview','primary')}</div>`}}}root.innerHTML=html;bind()}
function bind(){document.getElementById('themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('naklejki-theme',state.theme);applyTheme()};root.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{let a=el.dataset.action;if(a==='single'||a==='multi'){state.mode=a;state.step='paste'}else if(a==='clear'){state.raw='';state.selected.clear();state.step='paste';render();document.getElementById('raw').focus();return}else if(a==='preview'){if(!items().length){alert('Wprowadź poprawny numer i wybierz napięcie albo wklej numery K.');return}state.page='preview'}else if(a==='home'){state.page='home';state.step='paste'}else if(a==='edit'){state.page='home';if(state.mode==='multi')state.step='summary'}else if(a==='new'){state.page='home';state.single='';state.voltage='';state.raw='';state.selected=new Set();state.step='paste'}else if(a==='save'){state.year=document.getElementById('year').value;state.language=document.getElementById('language').value;localStorage.setItem('naklejki-year',state.year);localStorage.setItem('naklejki-lang',state.language);state.page='home'}else if(a==='print'){document.documentElement.dataset.printRotation=state.printRotation;applyPrintCalibration();document.fonts.load('12px Carlito').then(()=>document.fonts.load('bold 12px Carlito')).then(()=>window.print());return}else if(['paste','select','summary'].includes(a)){if(a==='select'&&!parse().unique.length){alert('Nie rozpoznano numerów K.');return}state.step=a}render()});root.querySelectorAll('[data-voltage]').forEach(el=>el.onclick=()=>{state.voltage=el.dataset.voltage;render()});root.querySelectorAll('[data-number]').forEach(el=>el.onclick=()=>{let n=el.dataset.number;state.selected.has(n)?state.selected.delete(n):state.selected.add(n);render()});let langPreview=document.getElementById('previewLanguage');if(langPreview)langPreview.onchange=e=>{state.language=e.target.value;localStorage.setItem('naklejki-lang',state.language);render()};for(const [id,key,min,max] of [['printOffsetY','naklejki-print-offset-y-centered',-10,10],['printScale','naklejki-print-scale',70,120]]){const input=document.getElementById(id);if(input)input.onchange=()=>{const n=Number(input.value);if(input.value.trim()===''||!Number.isFinite(n)){input.value=state[id];return}state[id]=Math.max(min,Math.min(max,n));input.value=state[id];localStorage.setItem(key,state[id]);applyPrintCalibration()}}let pr=document.getElementById('printRotation');if(pr)pr.onchange=e=>{state.printRotation=e.target.value;localStorage.setItem('naklejki-print-rotation',state.printRotation);applyPrintCalibration();document.documentElement.dataset.printRotation=state.printRotation};let s=document.getElementById('single');if(s)s.oninput=e=>state.single=e.target.value;let r=document.getElementById('raw');if(r)r.oninput=e=>{let pos=e.target.selectionStart;state.raw=e.target.value;render();let next=document.getElementById('raw');next.focus();next.setSelectionRange(pos,pos)}}document.getElementById('mainMenuBtn').onclick=()=>{state.page='home';state.mode='single';state.step='paste';render();window.scrollTo({top:0,behavior:'smooth'})};document.getElementById('settingsBtn').onclick=()=>{state.page=state.page==='settings'?'home':'settings';render()};render();
</script></body></html>
