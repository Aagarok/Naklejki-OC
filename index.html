<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Naklejki rozdzielnic — test</title><style>

padding:7px 10px;margin:3px;background:var(--selected);color:var(--selected-text);border-radius:7px;font-weight:600}.warning{background:var(--warning);color:var(--warning-text);padding:12px;border-radius:10px;margin-top:12px;white-space:pre-wrap}.sticker{border:1px solid var(--border);border-radius:10px;padding:18px;margin:12px 0}.sticker p{margin:8px 0}footer{padding:12px 24px;background:var(--surface2);color:var(--muted);font-size:12px}#message{margin-top:14px;color:var(--text)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}@media(max-width:480px){body{padding:12px 6px}main{padding:15px}header{padding:15px}.stats{gap:4px}.stat{font-size:12px}.header-actions button{padding:9px}}

/* v0.3: sheet 1 label preview */
.label-intro{margin:10px 0 14px;color:var(--muted)}
.label-sheet{background:#fff;color:#111;border:2px solid #222;border-radius:2px;padding:13px 17px;margin:15px 0;box-shadow:0 2px 8px #0002;font-family:Arial,sans-serif;max-width:650px}
.label-head{display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center;border-bottom:2px solid #222;padding-bottom:9px}
.label-contact{font-size:12px;line-height:1.5}.label-contact strong{font-size:16px}
.label-mark{width:100%;max-height:115px;object-fit:contain}
.label-title{text-align:center;font-size:19px;font-weight:800;text-transform:uppercase;margin:13px 0;border-bottom:1px solid #333;padding-bottom:9px}
.label-main{display:grid;grid-template-columns:105px 1fr;gap:12px;align-items:center}
.label-symbol{width:100%;max-height:130px;object-fit:contain}
.label-data{display:grid;grid-template-columns:125px minmax(0,1fr);gap:7px 10px;font-size:13px}
.label-data strong{overflow-wrap:anywhere}.label-bottom{border-top:1px solid #333;display:flex;justify-content:space-between;font-size:11px;padding-top:8px;margin-top:12px}

/* v0.4: physical label reference, 96.2 × 70.8 mm driver paper */
.label-sheet{width:100%;max-width:650px;aspect-ratio:1.82/1;background:linear-gradient(125deg,#f4f6f8,#c8d0d9 50%,#edf0f4);color:#111;border:0;border-radius:20px;padding:5% 6% 4%;margin:18px auto;box-shadow:0 3px 16px #0003;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;justify-content:space-between}

.label-ce{font-family:Arial,sans-serif;font-weight:900;font-size:clamp(28px,6vw,52px);letter-spacing:-.11em;padding-right:.15em}
.label-title{text-align:center;font-size:clamp(10px,1.9vw,16px);font-weight:750;text-transform:none;border-top:1px solid #333;border-bottom:0;margin:0;padding:4px 0 0}
.label-main{display:grid;grid-template-columns:24% 1fr;gap:3%;align-items:center;flex:1;min-height:0}
.label-symbol{width:100%;height:auto;max-height:130px;object-fit:contain;image-rendering:auto}
.label-data{display:grid;grid-template-columns:49% 51%;gap:4px 0;font-size:clamp(9px,1.7vw,15px);line-height:1.15;font-weight:400}.label-data strong{font-weight:400;overflow-wrap:anywhere}
.label-bottom{border:0;display:flex;justify-content:space-between;align-items:center;padding:0;margin:0;font-size:clamp(9px,1.5vw,13px)}
.label-bottom span:first-child{width:27%;text-align:center}.label-bottom span:last-child{font-weight:650}
@media(max-width:490px){.label-sheet{padding:4% 5%;border-radius:12px}.label-head{min-height:34%}.label-contact{font-size:clamp(8px,2.35vw,12px)}.label-ce{font-size:clamp(24px,8vw,36px)}.label-title{font-size:clamp(9px,2.65vw,13px)}.label-data{font-size:clamp(8px,2.2vw,12px);gap:2px 0}.label-bottom{font-size:clamp(8px,2vw,11px)}}
@media print{body{background:#fff;padding:0}.app{border:0;box-shadow:none;max-width:none}header,footer,.actions,.label-intro,h2{display:none!important}main{padding:0}.label-sheet{width:96.2mm;height:70.8mm;max-width:none;aspect-ratio:auto;margin:0;box-shadow:none;break-after:page;print-color-adjust:exact;-webkit-print-color-adjust:exact}}

}

 .label-symbol{width:100%!important;max-height:none!important}
 .label-data{grid-template-columns:47% 53%!important;font-size:8.5pt!important;gap:.8mm 0!important;font-weight:500!important;line-height:1.15!important}

}
/* v0.8: print workflow and screen navigation */
@media screen and (max-width:560px){.actions{flex-wrap:wrap}.actions button{flex:1 1 42%;white-space:normal}.label-sheet{overflow:hidden}}
@media print{.actions,.print-controls,#message{display:none!important}}

else {html=`<h2>Nowy wydruk</h2><p class="muted">Wybierz sposób przygotowania naklejek.</p><div class="tabs">${button('Pojedyncze','single',state.mode==='single'?'active':'')}${button('Mnogie','multi',state.mode==='multi'?'active':'')}</div>`;if(state.mode==='single'){html+=`<label>Numer urządzenia</label><input id="single" value="${escapeHTML(state.single)}" placeholder="Wpisz numer urządzenia"><label>Wybierz napięcie</label><div class="tiles">${['230 VAC','3X400 VAC'].map(v=>`<button class="tile ${state.voltage===v?'active':''}" data-voltage="${v}">⚡ ${v}${state.voltage===v?' ✓':''}</button>`).join('')}</div><div class="actions">${button('Podgląd i drukowanie →','preview','primary')}</div>`}else {let p=parse();if(state.step==='paste'){html+=`<label>Wklej dane z Excela lub Numbers</label><textarea id="raw" placeholder="Zaznacz komórki i wklej tutaj (⌘V / Ctrl+V)">${escapeHTML(state.raw)}</textarea><p class="muted">Wyodrębniamy tylko numery K. Pozostałe opisy są pomijane.</p><div class="stats"><div class="stat"><strong>${p.unique.length}</strong>Rozpoznane</div><div class="stat"><strong>${p.ignored.length}</strong>Pominięte*</div><div class="stat"><strong>${p.duplicates.length}</strong>Duplikaty</div></div>${p.unique.length?`<div class="panel">${p.unique.map(n=>`<span class="pill">K${escapeHTML(n)}</span>`).join('')}</div>`:''}${p.ignored.length||p.duplicates.length?`<div class="warning">${p.ignored.length?'Pominięte fragmenty: '+escapeHTML(p.ignored.join(' | '))+'\n':''}${p.duplicates.length?'Powtórzone numery: '+p.duplicates.map(n=>'K'+n).join(', '):''}</div>`:''}<p class="muted"><small>*Liczba pominiętych fragmentów jest orientacyjna, nie oznacza liczby central.</small></p><div class="actions">${button('Dalej: wybór 230 VAC →','select','primary')}</div>`}else if(state.step==='select'){html+=`<h2>Wybierz numery 230 VAC</h2><p class="muted">Pozostałe otrzymają automatycznie 3X400 VAC.</p><div class="tiles">${p.unique.map(n=>`<button class="tile ${state.selected.has(n)?'active':''}" data-number="${escapeHTML(n)}">K${escapeHTML(n)} ${state.selected.has(n)?'✓':''}</button>`).join('')}</div><div class="panel">230 VAC: ${p.unique.filter(n=>state.selected.has(n)).length} • 3X400 VAC: ${p.unique.filter(n=>!state.selected.has(n)).length}</div><div class="actions">${button('← Wróć','paste')}${button('Dalej →','summary','primary')}</div>`}else{html+=`<h2>Podsumowanie</h2><div class="panel"><b>230 VAC</b><p>${p.unique.filter(n=>state.selected.has(n)).map(n=>'K'+n).join(', ')||'Brak'}</p><b>3X400 VAC</b><p>${p.unique.filter(n=>!state.selected.has(n)).map(n=>'K'+n).join(', ')||'Brak'}</p></div><div class="actions">${button('← Wróć','select')}${button('Podgląd →','preview','primary')}</div>`}}}root.innerHTML=html;bind()}
function bind(){document.getElementById('themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('naklejki-theme',state.theme);applyTheme()};root.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{let a=el.dataset.action;if(a==='single'||a==='multi'){state.mode=a;state.step='paste'}else if(a==='preview'){if(!items().length){alert('Wprowadź poprawny numer i wybierz napięcie albo wklej numery K.');return}state.page='preview'}else if(a==='home'){state.page='home';state.step='paste'}else if(a==='edit'){state.page='home';if(state.mode==='multi')state.step='summary'}else if(a==='new'){state.page='home';state.single='';state.voltage='';state.raw='';state.selected=new Set();state.step='paste'}else if(a==='save'){state.year=document.getElementById('year').value;state.language=document.getElementById('language').value;localStorage.setItem('naklejki-year',state.year);localStorage.setItem('naklejki-lang',state.language);state.page='home'}else if(a==='print'){document.documentElement.dataset.printRotation=state.printRotation;window.print();return}else if(['paste','select','summary'].includes(a)){if(a==='select'&&!parse().unique.length){alert('Nie rozpoznano numerów K.');return}state.step=a}render()});root.querySelectorAll('[data-voltage]').forEach(el=>el.onclick=()=>{state.voltage=el.dataset.voltage;render()});root.querySelectorAll('[data-number]').forEach(el=>el.onclick=()=>{let n=el.dataset.number;state.selected.has(n)?state.selected.delete(n):state.selected.add(n);render()});let pr=document.getElementById('printRotation');if(pr)pr.onchange=e=>{state.printRotation=e.target.value;localStorage.setItem('naklejki-print-rotation',state.printRotation);document.documentElement.dataset.printRotation=state.printRotation};let s=document.getElementById('single');if(s)s.oninput=e=>state.single=e.target.value;let r=document.getElementById('raw');if(r)r.oninput=e=>{let pos=e.target.selectionStart;state.raw=e.target.value;render();let next=document.getElementById('raw');next.focus();next.setSelectionRange(pos,pos)}}document.getElementById('settingsBtn').onclick=()=>{state.page=state.page==='settings'?'home':'settings';render()};render();
</script></body></html>
