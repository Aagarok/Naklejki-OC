name: Windows portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.js
      - index.html
      - assets/**
      - desktop/**
      - package.json
      - package-lock.json
      - .github/workflows/windows.yml

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Naklejki-OC-Windows-x64
          path: dist/Naklejki-OC-*-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30
